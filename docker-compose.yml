services:
  postgres:
    image: postgres:16-alpine
    container_name: meal-planner-postgres
    environment:
      POSTGRES_DB: meal_planner
      POSTGRES_USER: meal
      POSTGRES_PASSWORD: meal
    ports:
      - "5432:5432"
    volumes:
      - meal_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal -d meal_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meal_planner_pgdata:
